# DonNation — stack de développement unifiée

# Démarrage rapide :
#   cp backend/.env.example backend/.env
#   cp frontend/.env.local.example frontend/.env.local
#   docker compose -f docker-compose.dev.yml up --build
#
# Plan B (recommandé pour Stripe CLI + déploiement contrats) :
#   Voir README.md § « Démarrage manuel »

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: donnation
      POSTGRES_PASSWORD: donnation
      POSTGRES_DB: donnation
    volumes:
      - donnation_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U donnation -d donnation']
      interval: 5s
      timeout: 5s
      retries: 10

  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    entrypoint: ['anvil', '--host', '0.0.0.0', '--port', '8545']
    ports:
      - '8545:8545'

  deploy-contracts:
    image: ghcr.io/foundry-rs/foundry:latest
    depends_on:
      - anvil
    volumes:
      - ./smart-contracts:/app
    working_dir: /app
    environment:
      FOUNDRY_DISABLE_NIGHTLY_WARNING: '1'
    entrypoint: /bin/sh
    command:
      - -c
      - |
        sleep 3
        forge script script/DonNationProtocol.s.sol:DonNationProtocolScript \
          --rpc-url http://anvil:8545 \
          --private-key 0xac0974bec39a17e36ba4a6a6410927071163121544f7a65394fc3e2e8f4e8e \
          --broadcast
        echo "Contrats déployés — copiez DON_NATION_PROTOCOL_ADDRESS depuis les logs forge"
    restart: 'no'

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - '3001:3000'
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://donnation:donnation@postgres:5432/donnation
      PORT: '3000'
      BASE_SEPOLIA_RPC_URL: http://anvil:8545
      APP_URL: http://localhost:3000
      CORS_ORIGIN: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "npx prisma migrate deploy && npx prisma db seed && node dist/main.js"
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
    depends_on:
      - backend

volumes:
  donnation_postgres_data:
