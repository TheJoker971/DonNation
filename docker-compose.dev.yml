# DonNation — stack de développement unifiée

# Démarrage rapide :
#   cp backend/.env.example backend/.env
#   cp frontend/.env.local.example frontend/.env.local
#   docker compose -f docker-compose.dev.yml up --build
#
# Plan B (Stripe CLI manuel) :
#   stripe listen --forward-to http://localhost:3001/api/v1/payments/stripe/webhook
#
# Stripe CLI est inclus ci-dessous (service stripe-cli).
# Au premier démarrage, copie le whsec_ affiché dans les logs vers backend/.env :
#   docker compose -f docker-compose.dev.yml logs stripe-cli | grep whsec

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: donnation
      POSTGRES_PASSWORD: donnation
      POSTGRES_DB: donnation
    volumes:
      - donnation_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U donnation -d donnation']
      interval: 5s
      timeout: 5s
      retries: 10

  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    entrypoint: ['anvil', '--host', '0.0.0.0', '--port', '8545']
    ports:
      - '8545:8545'
    healthcheck:
      test: ['CMD-SHELL', 'cast block-number --rpc-url http://127.0.0.1:8545 || exit 1']
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 2s

  deploy-contracts:
    image: ghcr.io/foundry-rs/foundry:latest
    depends_on:
      anvil:
        condition: service_healthy
    volumes:
      - ./smart-contracts:/app
    working_dir: /app
    environment:
      FOUNDRY_DISABLE_NIGHTLY_WARNING: '1'
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -e
        forge build
        forge script script/DonNationProtocol.s.sol:DonNationProtocolScript \
          --rpc-url http://anvil:8545 \
          --private-key 0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80 \
          --broadcast
        echo ""
        echo "=========================================="
        echo " DonNationProtocol = 0x5FbDB2315678afecb367f032d93F642f64180aa3"
        echo " (adresse déterministe Anvil compte #0)"
        echo "=========================================="
    restart: 'no'

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - '3001:3000'
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://donnation:donnation@postgres:5432/donnation
      PORT: '3000'
      # Blockchain locale (Anvil) — mint NFT + preuve on-chain
      BASE_SEPOLIA_RPC_URL: http://anvil:8545
      CHAIN_ID: '31337'
      BLOCKCHAIN_PRIVATE_KEY: '0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80'
      DON_NATION_PROTOCOL_ADDRESS: '0x5FbDB2315678afecb367f032d93F642f64180aa3'
      BLOCKCHAIN_CUSTODIAL_WALLET: '0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266'
      APP_URL: http://localhost:3000
      BACKEND_URL: http://localhost:3001
      BACKEND_PUBLIC_URL: http://localhost:3001
      CORS_ORIGIN: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      anvil:
        condition: service_healthy
      deploy-contracts:
        condition: service_completed_successfully
    command: >
      sh -c "npx --yes prisma@6 db push --accept-data-loss && node dist-seed/seed.js && node dist/main.js"
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
        # Clé publique Stripe — définie dans le .env racine (chargé auto par Compose)
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
    depends_on:
      - backend

  # Forward Stripe webhooks → backend (remplace "stripe listen" manuel)
  stripe-cli:
    image: stripe/stripe-cli:latest
    env_file:
      - ./backend/.env
    entrypoint: /bin/sh
    command:
      - -c
      - |
        echo "Stripe CLI — forward webhooks vers backend..."
        echo "Copie le whsec_ affiché ci-dessous dans backend/.env (STRIPE_WEBHOOK_SECRET) si les paiements restent PENDING."
        exec stripe listen --api-key "$$STRIPE_SECRET_KEY" --forward-to http://backend:3000/api/v1/payments/stripe/webhook --events payment_intent.succeeded,account.updated
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  donnation_postgres_data:
