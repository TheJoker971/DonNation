version: '3.8'
services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: donnation
      POSTGRES_PASSWORD: donnation
      POSTGRES_DB: donnation
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  db-init:
    image: postgres:15
    depends_on:
      - db
    command: ["sh", "-c", "until pg_isready -h db -p 5432; do echo 'Waiting for postgres...'; sleep 1; done; psql -h db -U donnation -d postgres -tc \"SELECT 1 FROM pg_database WHERE datname='donnation'\" | grep -q 1 || psql -h db -U donnation -d postgres -c \"CREATE DATABASE donnation\""]
    environment:
      PGPASSWORD: donnation
    restart: "no"

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file:
      - ../backend/.env
    environment:
      DATABASE_URL: "postgres://donnation:donnation@db:5432/donnation"
      NODE_ENV: development
      PORT: 3000
    ports:
      - "3001:3000"
    restart: on-failure
    depends_on:
      - db
      - db-init

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "http://localhost:3001/api/v1"
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: "pk_test_12345"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:3001/api/v1"
      NODE_ENV: development
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  db_data:
