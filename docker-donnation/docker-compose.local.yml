version: '3.8'
services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: donnation
      POSTGRES_PASSWORD: donnation
      POSTGRES_DB: donnation_dev
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file:
      - ../backend/.env
    environment:
      DATABASE_URL: "postgres://donnation:donnation@db:5432/donnation"
      NODE_ENV: development
      PORT: 3000
    ports:
      - "3001:3000"
    depends_on:
      - db

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "http://localhost:3001/api/v1"
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: "pk_test_12345"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:3001/api/v1"
      NODE_ENV: development
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  db_data:
